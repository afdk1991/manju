<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漫剧 Manju · 免费在线观影</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root[data-theme="dark"]{
  --bg:#0a0b10;--bg2:#12131a;--card:#1a1b26;--card2:#232433;
  --line:#2a2b3d;--text:#e8e9f3;--muted:#7a7b95;
  --accent:#6c5ce7;--accent2:#a29bfe;--accent-glow:rgba(108,92,231,.25);
  --shadow:0 8px 32px rgba(0,0,0,.3);
}
:root[data-theme="light"]{
  --bg:#f4f5f9;--bg2:#ffffff;--card:#ffffff;--card2:#f0f1f6;
  --line:#e3e4ec;--text:#1a1b26;--muted:#7a7b95;
  --accent:#6c5ce7;--accent2:#8b7fe8;--accent-glow:rgba(108,92,231,.12);
  --shadow:0 4px 20px rgba(0,0,0,.06);
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.6;min-height:100vh;
  transition:background .3s,color .3s;
}
.topbar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:16px;padding:12px 24px;
  background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--line);
}
.logo{font-size:20px;font-weight:800;cursor:pointer;white-space:nowrap;
  background:linear-gradient(135deg,var(--text),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo small{font-size:11px;font-weight:400;color:var(--muted);
  -webkit-text-fill-color:var(--muted);margin-left:6px}
.topbar .spacer{flex:1}
.topbar .stats{font-size:12px;color:var(--muted);
  background:var(--card);padding:4px 12px;border-radius:999px;border:1px solid var(--line)}
.theme-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--text);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.theme-btn:hover{border-color:var(--accent);transform:rotate(15deg)}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px 80px}
.hero{padding:32px 0 16px;text-align:center}
.hero h1{font-size:28px;font-weight:800;margin-bottom:6px;
  background:linear-gradient(135deg,var(--text),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);font-size:13px}
.search-wrap{max-width:560px;margin:18px auto;position:relative}
.search-wrap input{
  width:100%;padding:12px 20px 12px 46px;
  background:var(--card);border:1.5px solid var(--line);border-radius:999px;
  color:var(--text);font-size:14px;outline:none;transition:all .2s;
}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
.search-wrap::before{content:"🔍";position:absolute;left:16px;top:50%;
  transform:translateY(-50%);font-size:15px;opacity:.5}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.tab{padding:6px 14px;border-radius:999px;font-size:12px;
  background:var(--card);border:1px solid var(--line);color:var(--muted);
  cursor:pointer;transition:all .2s;white-space:nowrap}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;
  box-shadow:0 4px 14px var(--accent-glow)}
.filters{
  display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
  padding:10px 16px;background:var(--card);border-radius:12px;
  border:1px solid var(--line);margin-bottom:20px;
}
.filters label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.filters select{
  background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  color:var(--text);padding:5px 10px;font-size:12px;outline:none;cursor:pointer;
}
.sh{display:flex;align-items:center;gap:12px;margin:24px 0 14px}
.sh h2{font-size:17px;font-weight:700}
.sh .badge{font-size:11px;color:var(--accent2);background:var(--accent-glow);
  padding:3px 12px;border-radius:999px;font-weight:500}
.sh .bar{flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
@media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}}
.card{
  background:var(--card);border-radius:12px;overflow:hidden;
  cursor:pointer;transition:transform .25s,box-shadow .25s;position:relative;
  border:1px solid transparent;
}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent)}
.card .cw{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--card2)}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.card:hover img{transform:scale(1.05)}
.card .cg{position:absolute;inset:0;
  background:linear-gradient(transparent 50%,rgba(0,0,0,.75))}
.card .ep{position:absolute;bottom:6px;left:6px;
  background:rgba(0,0,0,.7);color:var(--accent2);
  font-size:10px;padding:2px 7px;border-radius:5px;font-weight:500}
.card .sc{position:absolute;top:6px;right:6px;
  background:rgba(0,0,0,.55);color:#ffd700;font-size:10px;
  padding:2px 7px;border-radius:5px}
.card .cm{padding:9px 11px}
.card .ct{font-size:12px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ci{margin-top:3px;font-size:10px;color:var(--muted);
  display:flex;justify-content:space-between}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
.detail{padding-top:16px}
.detail-head{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.detail-head img{width:180px;aspect-ratio:2/3;object-fit:cover;
  border-radius:12px;box-shadow:var(--shadow)}
.detail-info{flex:1;min-width:260px}
.detail-info h1{font-size:22px;font-weight:800;margin-bottom:8px}
.detail-info .meta{color:var(--muted);font-size:13px;margin-bottom:12px}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.detail-tags span{font-size:11px;color:var(--accent2);
  background:var(--accent-glow);padding:3px 10px;border-radius:999px}
.detail-info .desc{color:var(--muted);font-size:13px;line-height:1.7;max-width:600px}
.player-box{
  position:relative;width:100%;aspect-ratio:16/9;
  background:#000;border-radius:12px;overflow:hidden;margin-top:20px;
}
.player-box video{width:100%;height:100%;object-fit:contain}
.bigplay{
  position:absolute;inset:0;margin:auto;width:72px;height:72px;
  border-radius:50%;border:none;cursor:pointer;z-index:5;
  background:rgba(108,92,231,.85);color:#fff;font-size:28px;
  display:flex;align-items:center;justify-content:center;transition:transform .2s;
}
.bigplay:hover{transform:scale(1.1)}
.pload{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:6}
.pload.on{display:flex}
.spinner{width:40px;height:40px;border-radius:50%;
  border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent2);
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.perr{position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;
  background:rgba(0,0,0,.85);z-index:7;text-align:center;padding:20px}
.perr.on{display:flex}
.perr button{padding:9px 24px;border:none;border-radius:10px;
  background:var(--accent);color:#fff;font-size:13px;cursor:pointer}
.ep-title{font-size:15px;font-weight:700;margin:20px 0 10px}
.ep-list{display:flex;flex-wrap:wrap;gap:6px}
.epb{min-width:64px;padding:8px 12px;background:var(--card);
  border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-size:11px;cursor:pointer;transition:all .15s;text-align:center}
.epb:hover{border-color:var(--accent);transform:translateY(-1px)}
.epb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.back{display:inline-flex;align-items:center;gap:6px;
  margin-top:24px;color:var(--muted);cursor:pointer;font-size:13px;
  background:none;border:none;padding:0}
.back:hover{color:var(--text)}
.foot{margin-top:60px;padding:20px 0;text-align:center;
  font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.loading{padding:60px;text-align:center;color:var(--muted)}
.loading .spinner{margin:0 auto 12px}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo" onclick="goHome()">🎬 漫剧 Manju<small>免费在线观影</small></div>
  <div class="spacer"></div>
  <div class="stats" id="statBadge"></div>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">🌙</button>
</div>
<div class="wrap" id="app">
  <div class="loading"><div class="spinner"></div>加载中...</div>
</div>
<script>
let DATA=[],CATS=new Set();
const app=document.getElementById('app');
const statBadge=document.getElementById('statBadge');
let curSearch='',curCat='all',curSort='default',curYear='all';

function toggleTheme(){
  const html=document.documentElement;
  const cur=html.getAttribute('data-theme')||'dark';
  const next=cur==='dark'?'light':'dark';
  html.setAttribute('data-theme',next);
  document.getElementById('themeBtn').textContent=next==='dark'?'🌙':'☀️';
  localStorage.setItem('manju-theme',next);
}
(function(){
  const t=localStorage.getItem('manju-theme')||'dark';
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeBtn').textContent=t==='dark'?'🌙':'☀️';
})();

async function init(){
  try{
    const r=await fetch('api/v1/home.json?_='+Date.now());
    const h=await r.json();
    DATA=h.sections.reduce((a,s)=>a.concat(s.items),[]);
    DATA.forEach(it=>(it.tags||[]).forEach(t=>CATS.add(t)));
    statBadge.textContent=DATA.length+' 部';
    home();
  }catch(e){
    app.innerHTML='<div class="empty">加载失败: '+e.message+'<br><button onclick="init()" style="margin-top:16px;padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer">重试</button></div>';
  }
}

function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}

function getFiltered(){
  let items=DATA;
  if(curCat!=='all')items=items.filter(it=>(it.tags||[]).includes(curCat));
  if(curSearch)items=items.filter(it=>it.title.toLowerCase().includes(curSearch.toLowerCase()));
  if(curYear!=='all')items=items.filter(it=>String(it.release_year)===curYear);
  if(curSort==='eps')items=[...items].sort((a,b)=>(b.total_episodes||0)-(a.total_episodes||0));
  else if(curSort==='rating')items=[...items].sort((a,b)=>(b.score||0)-(a.score||0));
  return items;
}

function home(){
  const items=getFiltered();
  const cats=['all',...CATS];
  const years=[...new Set(DATA.map(it=>it.release_year).filter(Boolean))].sort().reverse();
  app.innerHTML=`
    <div class="hero">
      <h1>漫剧 Manju</h1>
      <p>免费在线观看 · ${DATA.length} 部漫剧短剧 · 持续更新</p>
    </div>
    <div class="search-wrap">
      <input type="text" placeholder="搜索剧名..." value="${esc(curSearch)}"
        oninput="curSearch=this.value;home()">
    </div>
    <div class="tabs">
      ${cats.map(c=>`<button class="tab ${curCat===c?'on':''}" onclick="curCat='${c}';home()">${c==='all'?'全部':esc(c)}</button>`).join('')}
    </div>
    <div class="filters">
      <label>排序
        <select onchange="curSort=this.value;home()">
          <option value="default" ${curSort==='default'?'selected':''}>默认</option>
          <option value="eps" ${curSort==='eps'?'selected':''}>集数最多</option>
          <option value="rating" ${curSort==='rating'?'selected':''}>评分最高</option>
        </select>
      </label>
      <label>年份
        <select onchange="curYear=this.value;home()">
          <option value="all" ${curYear==='all'?'selected':''}>全部</option>
          ${years.map(y=>`<option value="${y}" ${curYear==String(y)?'selected':''}>${y}</option>`).join('')}
        </select>
      </label>
    </div>
    <div class="sh">
      <h2>${curSearch||curCat!=='all'||curYear!=='all'?'筛选结果':'全部片单'}</h2>
      <span class="badge">${items.length} 部</span>
      <div class="bar"></div>
    </div>
    <div class="grid">
      ${items.map(it=>`
        <div class="card" onclick="series('${esc(it.id)}')">
          <div class="cw">
            <img src="${esc(it.cover)}" loading="lazy" onerror="this.style.background='#222';this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23222%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 font-size=%2230%22>🎬</text></svg>'">
            <div class="cg"></div>
            <span class="ep">${it.total_episodes||1}集</span>
            ${it.score?`<span class="sc">⭐${it.score}</span>`:''}
          </div>
          <div class="cm">
            <div class="ct">${esc(it.title)}</div>
            <div class="ci"><span>${it.release_year||''}</span><span>${(it.tags||[])[0]||''}</span></div>
          </div>
        </div>`).join('')}
    </div>
    ${items.length===0?'<div class="empty">没有找到相关内容</div>':''}
    <div class="foot">漫剧 Manju · 免费在线观影 · 资源聚合自互联网公开接口</div>
  `;
}

function series(id){
  const s=DATA.find(x=>x.id===id);
  if(!s)return home();
  const eps=s.episodes||[];
  app.innerHTML=`
    <div class="detail">
      <button class="back" onclick="goHome()">← 返回</button>
      <div class="detail-head" style="margin-top:16px">
        <img src="${esc(s.cover)}" onerror="this.style.visibility='hidden'">
        <div class="detail-info">
          <h1>${esc(s.title)}</h1>
          <div class="meta">${s.release_year||''} · ${esc(s.region||'')} · ${eps.length}集 · 更新中</div>
          <div class="detail-tags">${(s.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div>
          <div class="desc">${esc(s.synopsis||'')}</div>
        </div>
      </div>
      <div class="ep-title">选集 (${eps.length})</div>
      <div class="ep-list">
        ${eps.map((e,i)=>`<button class="epb" onclick="play('${esc(s.id)}',${i})">${esc(e.title||'第'+(i+1)+'集')}</button>`).join('')}
      </div>
    </div>`;
  if(eps.length)setTimeout(()=>play(s.id,0),400);
}

function play(sid,idx){
  const s=DATA.find(x=>x.id===sid);
  if(!s||!s.episodes||!s.episodes[idx])return;
  const ep=s.episodes[idx];
  window.scrollTo(0,0);
  app.innerHTML=`
    <div>
      <button class="back" onclick="series('${esc(sid)}')">← 返回详情</button>
      <div class="player-box" id="pbox">
        <video id="vid" playsinline></video>
        <button class="bigplay" id="bplay">▶</button>
        <div class="pload" id="pload"><div class="spinner"></div></div>
        <div class="perr" id="perr">
          <div>😞 播放失败</div>
          <button onclick="play('${esc(sid)}',${idx})">重试</button>
        </div>
      </div>
      <div style="margin-top:14px">
        <h1 style="font-size:17px;font-weight:700">${esc(s.title)}</h1>
        <p style="color:var(--muted);font-size:12px;margin-top:3px">${esc(ep.title||'')} · ${(s.tags||[]).join(' · ')}</p>
      </div>
      <div class="ep-title">选集</div>
      <div class="ep-list">
        ${s.episodes.map((e,i)=>`<button class="epb ${i===idx?'on':''}" onclick="play('${esc(sid)}',${i})">${esc(e.title||'第'+(i+1)+'集')}</button>`).join('')}
      </div>
    </div>`;
  const v=document.getElementById('vid');
  const bp=document.getElementById('bplay');
  const pl=document.getElementById('pload');
  const pe=document.getElementById('perr');
  pl.classList.add('on');
  function go(){pl.classList.remove('on');bp.style.display='none';v.play().catch(()=>{});}
  if(window.Hls&&Hls.isSupported()){
    const hls=new Hls({maxBufferLength:30,enableWorker:true});
    hls.loadSource(ep.url);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,go);
    hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal){pl.classList.remove('on');pe.classList.add('on');}});
  }else if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src=ep.url;v.addEventListener('loadedmetadata',go);
  }
  bp.onclick=()=>{v.play();bp.style.display='none';};
}

function goHome(){home();window.scrollTo(0,0)}
init();
</script>
</body>
</html>
