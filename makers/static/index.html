<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漫剧 Manju · 免费在线观影</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
*{box-sizing:margin:0;padding:0}
:root{--bg:#0a0b0f;--card:#1a1d28;--card2:#222636;--line:#2a2f42;--text:#f0f2f8;--muted:#7a8099;--accent:#6c5ce7;--accent2:#a29bfe;--ok:#2ecc71}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;min-height:100vh}
a{color:var(--accent2);text-decoration:none}
.top{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:16px;padding:14px 24px;background:rgba(10,11,15,.85);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}
.brand{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}
.brand-sub{color:var(--muted);font-size:12px;margin-left:8px;font-weight:400;-webkit-text-fill-color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 60px}
.hero{padding:36px 0 16px;text-align:center}
.hero h1{font-size:28px;font-weight:700;background:linear-gradient(135deg,#fff,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.hero p{color:var(--muted);font-size:13px}
.search-bar{max-width:560px;margin:20px auto;position:relative}
.search-bar input{width:100%;padding:12px 20px 12px 44px;background:var(--card);border:1px solid var(--line);border-radius:999px;color:var(--text);font-size:14px;outline:none}
.search-bar input:focus{border-color:var(--accent)}
.search-bar::before{content:"🔍";position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px}
.cat-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.cat-tab{padding:6px 16px;border-radius:999px;font-size:12px;background:var(--card);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:all .2s}
.cat-tab:hover{border-color:var(--accent);color:var(--text)}
.cat-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.section-head{display:flex;align-items:center;gap:10px;margin:24px 0 16px}
.section-head h2{font-size:18px;font-weight:600}
.section-head .count{font-size:12px;color:var(--muted);background:var(--card2);padding:2px 10px;border-radius:999px}
.section-head .line{flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media(min-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}}
.card{background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(108,92,231,.25)}
.card .cover-wrap{position:relative;aspect-ratio:3/4;overflow:hidden}
.card .cover{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.card:hover .cover{transform:scale(1.05)}
.card .cover-grad{position:absolute;inset:0;background:linear-gradient(transparent 60%,rgba(0,0,0,.8))}
.card .ep-badge{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.7);color:var(--accent2);font-size:11px;padding:3px 8px;border-radius:6px}
.card .meta{padding:10px 12px}
.card .t{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .info{margin-top:4px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.card .tag{display:inline-block;margin-top:6px;font-size:10px;color:var(--accent2);background:rgba(108,92,231,.15);padding:2px 8px;border-radius:4px}
.center{padding:60px 0;text-align:center;color:var(--muted)}
.player-shell{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;margin-top:20px}
.player-shell video{width:100%;height:100%;object-fit:contain}
.p-bigplay{position:absolute;inset:0;margin:auto;width:72px;height:72px;border-radius:50%;border:none;background:rgba(108,92,231,.8);color:#fff;font-size:28px;cursor:pointer;z-index:3}
.p-loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:4}
.p-loading.on{display:flex}
.spin{width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--accent2);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.p-error{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.8);z-index:5;text-align:center;padding:20px}
.p-error.on{display:flex}
.p-error button{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.watch-info{margin-top:16px}
.watch-info h1{font-size:18px;font-weight:600}
.watch-info p{color:var(--muted);font-size:13px;margin-top:4px}
.ep-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ep-btn{min-width:60px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:12px;cursor:pointer}
.ep-btn:hover{border-color:var(--accent)}
.ep-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.back{display:inline-block;margin-top:20px;color:var(--muted);cursor:pointer;font-size:13px}
.back:hover{color:var(--text)}
.foot{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="top">
  <div class="brand" onclick="showHome()">漫剧 Manju<span class="brand-sub">免费在线观影</span></div>
</div>
<div class="wrap" id="app"></div>
<script>
let allData=[];let allCats=new Set();
const app=document.getElementById('app');

async function loadData(){
  try{
    const res=await fetch('api/v1/home.json?_t='+Date.now());
    const home=await res.json();
    allData=home.sections.reduce((a,s)=>[...a,...s.items],[]);
    allData.forEach(it=>(it.tags||[]).forEach(t=>allCats.add(t)));
    showHome();
  }catch(e){
    app.innerHTML='<div class="center err">加载失败: '+e.message+'</div>';
  }
}

function showHome(search='',cat='all'){
  let items=allData;
  if(cat!=='all')items=items.filter(it=>(it.tags||[]).includes(cat));
  if(search)items=items.filter(it=>it.title.toLowerCase().includes(search.toLowerCase()));
  let cats=['all',...allCats];
  app.innerHTML=`
    <div class="hero"><h1>漫剧 Manju</h1><p>免费在线观看 · ${allData.length} 部漫剧短剧</p></div>
    <div class="search-bar"><input type="text" placeholder="搜索漫剧短剧..." value="${search}" oninput="showHome(this.value,'${cat}')"></div>
    <div class="cat-tabs">${cats.map(c=>`<button class="cat-tab ${cat===c?'active':''}" onclick="showHome('${search}','${c}')">${c==='all'?'全部':c}</button>`).join('')}</div>
    <div class="section-head"><h2>${search||cat!=='all'?'搜索结果':'全部漫剧'}</h2><span class="count">${items.length} 部</span><div class="line"></div></div>
    <div class="grid">${items.map(it=>`
      <div class="card" onclick="showSeries('${it.id}')">
        <div class="cover-wrap">
          <img class="cover" src="${it.cover}" loading="lazy" onerror="this.style.background='#222'">
          <div class="cover-grad"></div>
          <span class="ep-badge">${it.total_episodes||1} 集</span>
        </div>
        <div class="meta">
          <div class="t">${it.title}</div>
          <div class="info"><span>${it.release_year||''}</span><span>${it.score||'8.0'}</span></div>
          ${(it.tags||[]).slice(0,1).map(t=>`<span class="tag">${t}</span>`).join('')}
        </div>
      </div>`).join('')}
    </div>
    ${items.length===0?'<div class="center">没有找到相关内容</div>':''}
    <div class="foot">漫剧 Manju · 免费在线观影 · 资源来自互联网公开接口</div>
  `;
}

function showSeries(id){
  const s=allData.find(x=>x.id===id);
  if(!s)return showHome();
  const eps=s.episodes||[];
  app.innerHTML=`
    <div style="margin-top:20px">
      <div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">
        <img src="${s.cover}" style="width:180px;aspect-ratio:3/4;object-fit:cover;border-radius:16px" onerror="this.style.visibility='hidden'">
        <div style="flex:1;min-width:250px">
          <h1 style="font-size:24px;font-weight:700;margin-bottom:8px">${s.title}</h1>
          <div style="color:var(--muted);font-size:13px;margin-bottom:12px">${s.release_year||''} · ${s.region||''} · ${s.total_episodes||1} 集</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${(s.tags||[]).map(t=>`<span style="font-size:11px;color:var(--accent2);background:rgba(108,92,231,.15);padding:3px 10px;border-radius:999px">${t}</span>`).join('')}</div>
          <p style="color:var(--muted);font-size:13px">${s.synopsis||''}</p>
        </div>
      </div>
      <h2 style="font-size:15px;font-weight:600;margin:24px 0 12px">选集</h2>
      <div class="ep-list">${eps.map((e,i)=>`<button class="ep-btn" onclick="playEp('${s.id}',${i})">${e.title||'第'+(i+1)+'集'}</button>`).join('')}</div>
      <span class="back" onclick="showHome()">← 返回首页</span>
    </div>`;
  // 自动播放第一集
  if(eps.length>0)setTimeout(()=>playEp(s.id,0),300);
}

function playEp(sid,idx){
  const s=allData.find(x=>x.id===sid);
  if(!s||!s.episodes||!s.episodes[idx])return;
  const ep=s.episodes[idx];
  app.innerHTML=`
    <div class="player-shell" id="pshell">
      <video id="video" playsinline></video>
      <button class="p-bigplay" id="bigplay">▶</button>
      <div class="p-loading" id="ploading"><div class="spin"></div></div>
      <div class="p-error" id="perror"><div>播放失败</div><button onclick="playEp('${sid}',${idx})">重试</button></div>
    </div>
    <div class="watch-info">
      <h1>${s.title} - ${ep.title}</h1>
      <p>${s.tags?s.tags.join(' · '):''}</p>
    </div>
    <div class="ep-list">${s.episodes.map((e,i)=>`<button class="ep-btn ${i===idx?'active':''}" onclick="playEp('${sid}',${i})">${e.title||'第'+(i+1)+'集'}</button>`).join('')}</div>
    <span class="back" onclick="showSeries('${sid}')">← 返回详情</span>
  `;
  const video=document.getElementById('video');
  const bigplay=document.getElementById('bigplay');
  const loading=document.getElementById('ploading');
  const error=document.getElementById('perror');
  const url=ep.url;
  loading.classList.add('on');
  function startPlay(){
    loading.classList.remove('on');
    bigplay.style.display='none';
    video.play().catch(()=>{});
  }
  if(Hls.isSupported()){
    const hls=new Hls({maxBufferLength:30});
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,startPlay);
    hls.on(Hls.Events.ERROR,function(_,data){
      if(data.fatal){loading.classList.remove('on');error.classList.add('on');}
    });
  }else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=url;
    video.addEventListener('loadedmetadata',startPlay);
  }
  bigplay.onclick=()=>{video.play();bigplay.style.display='none';};
}

loadData();
</script>
</body>
</html>
