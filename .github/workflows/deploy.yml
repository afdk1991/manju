name: Deploy to EdgeOne Makers

on:
  push:
    branches: [main]
    paths:
      - "makers/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install EdgeOne CLI
        # 锁定连接器版（含 skills 后端）；公开版 1.6.40+ 会导致 token 无效
        run: npm install -g edgeone@1.6.17-beta.1

      - name: Deploy to EdgeOne Makers (production)
        working-directory: makers
        env:
          PAGES_SOURCE: skills
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          set +e
          edgeone makers deploy . -n manju -t "$EDGEONE_API_TOKEN" --skip-ai-gateway-sync --json > deploy_out.json 2>&1
          cat deploy_out.json
          set -e
          read_status() {
            python3 -c 'import json,sys,re
          raw=open("deploy_out.json",encoding="utf-8",errors="replace").read()
          raw=re.sub(r"\x1b\[[0-9;?]*[a-zA-Z]","",raw)   # CLI 输出带 ANSI 颜色码，必须先剥离
          lines=[l for l in raw.splitlines() if l.strip().startswith("{")]
          try:
              d=json.loads(lines[-1]) if lines else {}
          except Exception as e:
              print("PARSE_FAIL:"+str(e)); sys.exit(0)
          print(d.get(sys.argv[1],"") or "EMPTY")' "$1"
          }
          STATUS=$(read_status status)
          PID=$(read_status projectId)
          DEP=$(read_status deploymentId)
          echo "status=$STATUS projectId=$PID deploymentId=$DEP"
          [ "$STATUS" = "success" ] || {
            # 失败响应不带 deploymentId，此时回退到项目部署列表页
            if [ "$DEP" = "EMPTY" ]; then
              URL="https://console.cloud.tencent.com/edgeone/pages/project/makers-vypuaynzkt0c/deployment"
            else
              URL="https://console.cloud.tencent.com/edgeone/pages/project/makers-vypuaynzkt0c/deployment/$DEP"
            fi
            echo "❌ 部署未成功（status=$STATUS）。云端构建日志需到控制台查看："
            echo "   $URL"
            exit 1; }
          [ "$PID" = "makers-vypuaynzkt0c" ] || {
            echo "❌ 项目守卫失败：必须复用现有项目 makers-vypuaynzkt0c，实际为 $PID"; exit 1; }
          echo "✅ 部署成功且项目守卫通过：$PID"