apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * 漫剧 Android 端构建配置。
 * applicationId 必须与 Java 包名 (com.manju) 一致，否则 FileProvider authority 不匹配。
 */
react {
    /* 新架构（Fabric / TurboModules）开关，默认开启 */
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    namespace "com.manju"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.manju"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        // OTA 上报需要的设备指纹在 RN 侧生成，无需在此处理
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // 发布签名：从 android/keystore.properties 读取（该文件已 gitignore）。
        // 文件不存在时（如 CI 未注入）release 构建会显式失败，避免静默产出 debug 签名的包。
        release {
            def propsFile = rootProject.file('keystore.properties')
            if (!propsFile.exists()) {
                throw new GradleException(
                    "缺少 ${propsFile}：release 构建需要发布签名配置。" +
                    "复制 keystore.properties.example 并填入真实密钥，或在 CI 中注入。")
            }
            def props = new Properties()
            propsFile.withInputStream { props.load(it) }
            storeFile file(props['STORE_FILE'])
            storePassword props['STORE_PASSWORD']
            keyAlias props['KEY_ALIAS']
            keyPassword props['KEY_PASSWORD']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)
